<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poseidon's Kiss - Splash Physics Simulator</title>
<style>
:root{--bg:#0b1220;--ink:#cfe3f5;--dim:#5b7590;--accent:#38bdf8;--line:#1c2c42;--card:#101a2c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px}
h1{font-size:26px;letter-spacing:6px;color:var(--accent);text-transform:uppercase}
.sub{color:var(--dim);letter-spacing:2.5px;font-size:10.5px;text-transform:uppercase;margin-top:6px}
#stage{margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;width:min(520px,94vw);height:340px;position:relative;overflow:hidden}
#bowl{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:240px;height:120px;background:linear-gradient(#1e3a5f,#0e2038);border:3px solid #dbe7f3;border-top:none;border-radius:0 0 120px 120px}
#water{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);width:228px;height:26px;background:linear-gradient(#38bdf8,#0284c7);border-radius:50%/60%;opacity:.9}
#drop{position:absolute;font-size:30px;transition:none}
.splash{position:absolute;font-size:16px;opacity:.95;pointer-events:none}
#hud{font-size:12px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;text-align:center;line-height:2}
#hud b{color:var(--accent)}
#controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(520px,94vw)}
button{cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-family:inherit;font-size:13px;transition:border-color .15s}
button:hover{border-color:var(--accent)}
#log{width:min(520px,94vw);margin-top:14px;font-size:11.5px;color:var(--dim);line-height:1.75;text-align:center}
#verdict{font-size:15px;margin-top:10px;min-height:24px;color:var(--ink);text-align:center}
</style>
</head>
<body>
<h1>Poseidon's Kiss</h1>
<div class="sub">a rigorous study of splash dynamics &middot; keep the throne dry</div>
<div id="stage"><div id="bowl"></div><div id="water"></div></div>
<div id="hud"></div>
<div id="verdict"></div>
<div id="controls">
<button id="dropBtn">DROP THE PEARL</button>
<button id="paperBtn">LAY THE SAFETY PAPER <small style="display:block;font-size:10px;color:var(--dim)">3 uses per sitting</small></button>
</div>
<div id="log"></div>
<script>
const $=id=>document.getElementById(id);
const S={drops:0,kissed:0,paper:3,sitting:1,best:0,over:false};
const VERDICTS_DRY=['A silent entry. Greg Louganis approves.','Ripples, but the throne stays dry.','Poseidon sleeps.','Minimal displacement. Textbook.'];
const VERDICTS_WET=['THE KISS. Cold. Judgmental.','Splash contact. Poseidon claims another.','Direct hit. The sea remembers.','Neptune sends his regards.'];
function hud(){$('hud').innerHTML='SITTING <b>'+S.sitting+'</b> &middot; DROPS <b>'+S.drops+'</b> &middot; KISSES SUFFERED <b>'+(S.kissed||0)+'</b> &middot; PAPER LEFT <b>'+S.paper+'</b> &middot; BEST DRY STREAK <b>'+S.best+'</b>';}
function log(t,c){const d=document.createElement('div');d.textContent=t;if(c)d.style.color=c;$('log').prepend(d);}
function drop(usePaper){
 if(S.over)return;
 const stage=$('stage');const d=document.createElement('div');d.id='drop';d.textContent='💧';
 const startX=60+Math.random()*400;d.style.left=startX+'px';d.style.top='10px';
 stage.appendChild(d);
 const entryX=startX+ (Math.random()*60-30);
 let y=10;const targetY=200;let vy=2+Math.random()*2;
 const iv=setInterval(()=>{
  y+=vy;vy+=0.35;d.style.top=y+'px';
  if(y>=targetY){
   clearInterval(iv);d.remove();
   S.drops++;
   const centerDist=Math.abs(entryX-260)/260;
   const energy=vy*(1-centerDist*0.8);
   const safe = usePaper ? energy<9 : energy<4.5;
   splash(entryX,safe);
   if(safe){S.best=Math.max(S.best+1,S.best);$('verdict').textContent=VERDICTS_DRY[Math.floor(Math.random()*VERDICTS_DRY.length)];log('Drop '+S.drops+': clean entry.'+(usePaper?' The paper took one for the team.':''),'var(--accent)');}
   else{S.kissed++;S.best=0;$('verdict').textContent=VERDICTS_WET[Math.floor(Math.random()*VERDICTS_WET.length)];log('Drop '+S.drops+': KISSED.','#f87171');}
   hud();
   if(S.drops>=8){end();}
  }},16);}
function splash(x,safe){
 const stage=$('stage');
 const n=safe?3:9;
 for(let i=0;i<n;i++){
  const p=document.createElement('div');p.className='splash';p.textContent=safe?'·':'💦';
  p.style.left=(x+ (Math.random()*40-20))+'px';p.style.top='190px';stage.appendChild(p);
  const dx=(Math.random()*60-30),dy=safe?-(10+Math.random()*20):-(60+Math.random()*90);
  p.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px)',opacity:0}],{duration:safe?300:600}).onfinish=()=>p.remove();}}
function end(){
 S.over=true;
 const dry=8-S.kissed;
 const msg=S.kissed===0?'A PERFECT SITTING. Eight drops, zero kisses. Poseidon files a formal complaint.':S.kissed<=2?'A dignified sitting. Only '+S.kissed+' kiss(es). The sea respects restraint.':'A catastrophic sitting. '+S.kissed+' kisses. The mirror of the water shows only your own poor planning.';
 $('verdict').textContent=msg;log(msg,S.kissed<=2?'var(--accent)':'#f87171');
 const b=document.createElement('button');b.textContent='NEW SITTING';
 b.onclick=()=>{Object.assign(S,{drops:0,kissed:0,paper:3,sitting:S.sitting+1,best:0,over:false});$('verdict').textContent='';$('log').innerHTML='';hud();b.remove();};
 $('controls').appendChild(b);}
$('dropBtn').onclick=()=>drop(false);
$('paperBtn').onclick=()=>{if(S.paper>0&&!S.over){S.paper--;hud();log('Safety paper deployed. The next drop is cushioned.');drop(true);}else if(!S.over){log('Out of paper. Nature finds a way.');}};
hud();
</script>
</body>
</html>
